# ===== 사이트 기본 정보 =====
title: "Hello Data Science"
description: "Python·R 데이터 분석, 머신러닝, 딥러닝 강의 노트"
url: "https://www.hds.ai.kr"
locale: "ko-KR"

# ===== 테마 (GitHub Pages는 remote_theme 방식) =====
remote_theme: "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin: "default"

# ===== 플러그인 =====
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# _pages 폴더 안의 파일들을 실제 페이지로 빌드하기 위한 설정.
# 이게 없으면 _pages/resume.html 같은 파일은 Jekyll이 무시해서 404가 납니다.
collections:
  pages:
    output: true
    permalink: /:path/

# ===== 작성자 프로필 (사이드바) =====
# home: 사이드바의 이름(나성호)을 클릭했을 때 이동할 주소
author:
  name: "나성호 (Seongho Na)"
  bio: "데이터 사이언스 강사<br>헬로데이터사이언스 대표"
  home: /resume/
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/HelloDataScience"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:hellodatasciencekorea@gmail.com"
    - label: "이력서"
      icon: "fas fa-fw fa-file-lines"
      url: "/resume/"

# ===== 모든 글에 적용될 기본값 =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true

# 한글 카테고리가 URL에 들어가 깨지지 않도록 슬러그 기반 경로 사용
permalink: /posts/:title/

# 홈 페이지네이션
paginate: 10
paginate_path: /page:num/
