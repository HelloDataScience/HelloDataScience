# ===== 사이트 기본 정보 =====
title: "Hello Data Science"
description: "Python·R 데이터 분석, 머신러닝, 딥러닝 강의 노트"
url: "https://www.hds.ai.kr"
locale: "ko-KR"

# 상단 메뉴 왼쪽 로고. 로고 이미지 자체에 "헬로데이터사이언스 / HELLO DATA SCIENCE"
# 글자가 이미 들어있어서, 옆에 "Hello Data Science" 텍스트가 중복 표시되지 않도록
# masthead_title을 빈 값으로 비워둔다(완전히 빈 문자열이면 site.title로 대체되어버려서
# 공백 하나를 넣어야 실제로 안 보인다).
logo: "/assets/images/logo.jpg"
masthead_title: " "

# ===== 테마 (GitHub Pages는 remote_theme 방식) =====
remote_theme: "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin: "default"

# ===== 플러그인 =====
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

# _pages 폴더 안의 파일들을 실제 페이지로 빌드하기 위한 설정.
# 이게 없으면 _pages/resume.html 같은 파일은 Jekyll이 무시해서 404가 납니다.
#
# archive_r: 2018년 R 강의 노트 전용 collection. 일부러 posts와 분리해서
# 홈 화면 최근 글 목록·태그/카테고리·RSS 피드에 안 섞이게 한다.
# /archive/ 페이지에서만 링크로 들어갈 수 있다 (/sports/ 페이지와 같은 패턴).
collections:
  pages:
    output: true
    permalink: /:path/
  archive_r:
    output: true
    permalink: /archive/:path/

# docs/ 는 내부 운영 문서(예: sports 프록시 설정 노트)라 사이트에는 배포하지 않음
exclude:
  - docs

# ===== 작성자 프로필 (사이드바) =====
# home: 사이드바의 이름(나성호)을 클릭했을 때 이동할 주소
author:
  name: "나성호 (Seongho Na)"
  bio: '<i class="fas fa-fw fa-chalkboard-teacher"></i> 데이터 사이언스 강사<br><i class="fas fa-fw fa-briefcase"></i> 헬로데이터사이언스 대표'
  home: /resume/
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/HelloDataScience"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:pyringual@hds.ai.kr"
    - label: "Resume"
      icon: "fas fa-fw fa-file-lines"
      url: "/resume/"

# ===== 사이트 푸터 =====
footer:
  links:
    - label: "개인정보처리방침"
      icon: "fas fa-fw fa-link"
      url: "/privacy-policy/"

# ===== 댓글 (Disqus) =====
comments:
  provider: "disqus"
  disqus:
    shortname: "hellodatascience"

# ===== 방문자 분석 (Google Analytics 4) =====
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-XH5N9LTE27"
    anonymize_ip: false

# ===== 모든 글에 적용될 기본값 =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      date_format: "%Y년 %m월 %d일"
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: archive_r
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      date_format: "%Y년 %m월 %d일"
      comments: false
      share: false
      related: false
      toc: true
      toc_sticky: true

# 한글 카테고리가 URL에 들어가 깨지지 않도록 슬러그 기반 경로 사용
permalink: /posts/:title/

# 홈 페이지네이션
paginate: 10
paginate_path: /page:num/

# ===== 사이트 내 검색 (lunr, GitHub Pages와 100% 호환) =====
search: true
search_full_content: true
