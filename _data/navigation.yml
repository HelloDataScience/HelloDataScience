# _data/navigation.yml
#
# minimal-mistakes 상단 메뉴(masthead). 테마가 site.data.navigation.main 을 읽어갑니다.
# url 은 도메인을 빼고 슬래시로 시작하는 경로만 적습니다 —
# 테마가 relative_url 필터를 붙여주므로 전체 주소를 쓰면 오히려 어긋납니다.

main:
  - title: "Home"
    url: /

  - title: "생성형 AI 데이터 분석"
    url: /genai-series/

  - title: "아카이브"
    url: /archive/

  - title: "태그"
    url: /tags/

  - title: "카테고리"
    url: /categories/

# 연재 사이드바 목차. 테마가 site.data.navigation.genai 를 읽어갑니다 —
# 각 글 front matter에 sidebar.nav: "genai" 를 넣으면 왼쪽에 목차가 붙고,
# 지금 보고 있는 회차에 테마가 알아서 active 표시를 해줍니다.
#
# 사이드바 폭이 좁아서 제목은 원문 그대로가 아니라 짧게 줄여 적었습니다.
# url 은 각 글의 permalink(/posts/:title/)와 정확히 같아야 active 표시가 됩니다.

genai:
  - title: "생성형 AI로 시작하는 데이터 분석"
    children:
      - title: "연재 전체 목차"
        url: /genai-series/
      - title: "시작하며 — Python 모르는 사람만"
        url: /posts/genai-data-analysis-for-beginners/
      - title: "1회 — 규칙 기반 AI에서 생성형 AI까지"
        url: /posts/genai-data-analysis-for-beginners-1/
      - title: "2회 — 에이스의 정체"
        url: /posts/genai-data-analysis-for-beginners-2/
      - title: "3회 — 환각과 인지부채"
        url: /posts/genai-data-analysis-for-beginners-3/
      - title: "4회 — 대화형·코파일럿·에이전트"
        url: /posts/genai-data-analysis-for-beginners-4/
      - title: "5회 — 프롬프트의 9가지 요소"
        url: /posts/genai-data-analysis-for-beginners-5/
      - title: "6회 — 단계적 요청과 나만의 GPT"
        url: /posts/genai-data-analysis-for-beginners-6/
      - title: "7회 — Python·Colab 첫걸음"
        url: /posts/genai-data-analysis-for-beginners-7/
      - title: "8회 — 고객 이탈 데이터 실습"
        url: /posts/genai-data-analysis-for-beginners-8/
      - title: "9회 — 반도체 품질 데이터 실습"
        url: /posts/genai-data-analysis-for-beginners-9/

