# _data/navigation.yml
#
# minimal-mistakes 상단 메뉴(masthead). 테마가 site.data.navigation.main 을 읽어갑니다.
# url 은 도메인을 빼고 슬래시로 시작하는 경로만 적습니다 —
# 테마가 relative_url 필터를 붙여주므로 전체 주소를 쓰면 오히려 어긋납니다.

main:
  - title: "Home"
    url: /

  - title: "생성형 AI 데이터 분석"
    url: /genai-series/

  - title: "R 아카이브"
    url: /archive/

  - title: "태그"
    url: /tags/

  - title: "카테고리"
    url: /categories/

# Today's Sports는 데이터 분석 블로그 주제와 무관하고 AdSense 심사(발행자 콘텐츠
