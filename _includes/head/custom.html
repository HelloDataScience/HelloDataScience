<!-- 테마 기본값은 .site-logo img { max-height: 2rem } 인데, 이 사이트는 넓은 화면에서
     html 기본 font-size를 22px까지 키우는 반응형 규칙이 있어서 데스크톱 기준 2rem이
     이미 44px로 계산되고 있었다(처음에 40px로 잡았다가 오히려 작아지는 실수를 했음).
     확실히 더 크게 보이도록 56px로 고정. main.css가 이 파일보다 먼저 로드되므로
     !important 없이 캐스케이드로 덮어씀. -->
<style>
  .site-logo img { max-height: 56px; }
  /* 로고 원본 이미지(logo.jpg) 자체에 아이콘 왼쪽으로 내장 여백이 있어서(560px 기준 약 31px),
     박스 위치는 사이드바 이름과 같아도 실제 아이콘은 그만큼 안쪽에서 시작해 밀려 보인다.
     -12px로 당겼더니 이번엔 너무 왼쪽으로 붙어서, 절반인 -6px로 조정. */
  .site-logo img { margin-left: -6px; }

  /* 사이드바 소개(강사/대표 두 줄)의 기본 line-height가 font-size와 똑같은 22px라
     두 줄이 거의 붙어 보인다. 아이콘 불릿 추가하면서 더 두드러져서 줄간격을 넓힘. */
  .author__bio { line-height: 1.8; }
</style>
